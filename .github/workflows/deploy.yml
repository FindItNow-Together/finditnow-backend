name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [auth, user-service, shop-service, order-service, delivery-service, file-gateway]
        include:
          - service: auth
            context: services/auth
            image_suffix: auth
          - service: user-service
            context: services/user-service
            image_suffix: user
          - service: shop-service
            context: services/shop-service
            image_suffix: shop
          - service: order-service
            context: services/order-service
            image_suffix: order
          - service: delivery-service
            context: services/delivery-service
            image_suffix: delivery
          - service: file-gateway
            context: services/file-gateway
            image_suffix: file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in service
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '${{ matrix.context }}/**'
              - 'libs/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'

      - name: Set up JDK 21
        if: steps.filter.outputs.changed == 'true' || github.run_number <= 5
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        if: steps.filter.outputs.changed == 'true' || github.run_number <= 5
        run: ./gradlew :services:${{ matrix.service }}:installDist

      - name: Log in to the Container registry
        if: steps.filter.outputs.changed == 'true' || github.run_number <= 5
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        if: steps.filter.outputs.changed == 'true' || github.run_number <= 5
        run: |
          echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME_PREFIX }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        if: steps.filter.outputs.changed == 'true' || github.run_number == 1
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        if: steps.filter.outputs.changed == 'true' || github.run_number <= 5
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/nginx/nginx.prod.conf.template"
          target: "~/finditnow-backend"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/finditnow-backend
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "/^IMAGE_OWNER=/d" .env
            echo "IMAGE_OWNER=${OWNER_LC}" >> .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
