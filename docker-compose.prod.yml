services:

  postgres:
    image: postgres:15
    container_name: finditnow-postgres-prod
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infra/data/data-prod/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: finditnow-redis-prod
    restart: unless-stopped
    volumes:
      - ./infra/data/data-prod/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-auth:latest
    container_name: finditnow-auth-prod
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-user:latest
    container_name: finditnow-user-prod
    restart: unless-stopped
    env_file: .env
    expose:
      - "8081"
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  shop:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-shop:latest
    container_name: finditnow-shop-prod
    restart: unless-stopped
    env_file: .env
    expose:
      - "8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-order:latest
    container_name: finditnow-order-prod
    restart: unless-stopped
    env_file: .env
    expose:
      - "8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  delivery:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-delivery:latest
    container_name: finditnow-delivery-prod
    restart: unless-stopped
    env_file: .env
    expose:
      - "8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  file:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-backend-file:latest
    container_name: finditnow-file-prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./infra/data/file-uploads:/app/data/uploads
    expose:
      - "8090"

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/finditnow-frontend:latest
    container_name: finditnow-frontend-prod
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: finditnow-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    depends_on:
      - auth
      - user
      - shop
      - order
      - delivery
      - file
      - frontend
    volumes:
      - ./infra/nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: >
      sh -c "
      rm -f /etc/nginx/conf.d/default.conf &&
      /docker-entrypoint.sh nginx -g 'daemon off;'
      "
